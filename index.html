<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PromptDeck — local, private studio for prompting and benchmarking LLMs side-by-side." />
    <meta name="theme-color" content="#4f46e5" />
    <title>PromptDeck — Local LLM Benchmark Studio</title>
  </head>

  <body>
    <script>
      // Apply persisted theme before the bundle loads to avoid a theme flash.
      try {
        var raw = localStorage.getItem('promptdeck-settings');
        var theme = raw ? (JSON.parse(raw).state || {}).theme : null;
        if (theme !== 'light') document.documentElement.classList.add('dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
