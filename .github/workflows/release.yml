name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ---------------------------------------------------------------------------
  # 1) Create the draft release exactly ONCE, before the build matrix starts.
  #
  # Why: the four matrix jobs start at the same time. If each of them tries to
  # find-or-create the release for the tag, a draft is invisible to the "find by
  # tag" lookup, so several jobs create their own draft and the binaries end up
  # split across duplicate releases (and `latest.json` lists only some platforms).
  # Creating it here and handing the id to every matrix job removes that race.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create (or reuse) the draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Release notes come from the CHANGELOG section for this tag.
          node scripts/extract-notes.cjs "$TAG" > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Release notes are empty for $TAG."
            exit 1
          fi

          # Idempotent: if a release for this tag already exists (e.g. the
          # workflow was re-run), reuse it instead of creating a duplicate.
          # NOTE: it must still be a draft; tauri-action requires
          # `releaseDraft` to match the existing release's status.
          EXISTING=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            echo "Reusing existing release $EXISTING for $TAG"
            ID="$EXISTING"
          else
            ID=$(gh api "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f name="PromptDeck $TAG" \
              -F draft=true \
              -F prerelease=false \
              -F body=@notes.md \
              --jq .id)
            echo "Created draft release $ID for $TAG"
          fi

          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2) Build every platform and upload into that single release.
  # ---------------------------------------------------------------------------
  release:
    name: Build (${{ matrix.platform }} ${{ matrix.args }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Tauri npm/Rust version gate
        # Fails the release when `@tauri-apps/*` and the matching Rust crates
        # have drifted apart (`tauri build` cannot complete on such a pair).
        # Kept out of ci.yml so Dependabot's per-ecosystem PRs stay mergeable.
        run: node scripts/check-tauri-versions.cjs

      - name: Install frontend dependencies
        run: npm ci

      # --- Code signing (optional, uncomment when certificates exist) ---
      # macOS notarization needs an Apple Developer account ($99/yr) plus these
      # Actions secrets: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID.
      # - name: Import Apple signing certificate
      #   if: matrix.platform == 'macos-latest'
      #   uses: apple-actions/import-codesign-certs@v5
      #   with:
      #     p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
      #     p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # Windows SmartScreen needs an EV code-signing certificate on a hardware
      # token (or Azure Trusted Signing); uncomment + configure once owned.
      # See https://v2.tauri.app/distribute/sign/windows/

      - name: Build and upload Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private updater signing key (Settings → Secrets → Actions).
          # The matching public key is committed in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Uncomment with the Apple secrets above to notarize macOS builds:
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Upload into the release created above; never create another one.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Keep tagName too: without it the updater URLs in latest.json point
          # at `releases/latest/download/...` instead of this exact tag.
          tagName: ${{ github.ref_name }}
          # Must match the status of the existing (draft) release.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # 3) Safety net: the matrix jobs all merge their platform into the same
  # latest.json. If two of them ever finish at the same instant one can
  # overwrite the other, silently dropping a platform from auto-update.
  # Fail loudly here instead of finding out from a user.
  # ---------------------------------------------------------------------------
  verify-release:
    name: Verify release assets
    needs: [create-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check latest.json covers every platform
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail

          ASSET_ID=$(gh api "repos/$REPO/releases/$RELEASE_ID" \
            --jq '.assets[] | select(.name == "latest.json") | .id')
          if [ -z "$ASSET_ID" ]; then
            echo "::error::latest.json was not uploaded to the release."
            exit 1
          fi

          curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID" \
            -o latest.json

          node -e '
            const fs = require("fs");
            const platforms = Object.keys(JSON.parse(fs.readFileSync("latest.json", "utf8")).platforms || {});
            const required = ["darwin-aarch64", "darwin-x86_64", "linux-x86_64", "windows-x86_64"];
            const missing = required.filter((k) => !platforms.includes(k));
            console.log("platforms in latest.json:", platforms.join(", "));
            if (missing.length) {
              console.error("::error::latest.json is missing: " + missing.join(", "));
              process.exit(1);
            }
          '

      - name: Check there is exactly one release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/$REPO/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | length" | awk '{s+=$1} END{print s+0}')
          echo "releases for $TAG: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "::error::Expected exactly 1 release for $TAG but found $COUNT."
            exit 1
          fi
