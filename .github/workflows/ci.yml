name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: ESLint
        run: npx eslint .

      # Prettier is enforced in CI because the whole tree was formatted once
      # (.prettierrc existed but was never applied), so this gate is what keeps
      # it from drifting again.
      - name: Prettier
        run: npx prettier --check .

      # The Tauri npm/Rust parity gate deliberately does NOT run here: Dependabot
      # opens the npm and Rust halves as separate PRs, so a per-PR gate would
      # red-flag both forever. It runs in release.yml instead, where it still
      # stops a half-updated pair from being tagged as a release.
      - name: Build frontend
        run: npm run build

  rust-check:
    name: Rust format & build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Check Rust formatting
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Cargo check
        working-directory: ./src-tauri
        run: cargo check

      - name: Clippy lints
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings
