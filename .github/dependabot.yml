version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # All Tauri JS packages in one PR so they move together.
      # NOTE: groups are per-ecosystem — the matching cargo group still lands
      # as a separate PR. The CI "tauri-versions" gate below is what actually
      # blocks merging one side without the other.
      tauri:
        patterns:
          - "@tauri-apps/*"
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-build"
          - "tauri-plugin-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
