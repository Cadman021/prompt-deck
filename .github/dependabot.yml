version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors break typescript-eslint (capped at the previous
      # major). Revisit manually when the plugin catches up.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # All Tauri JS packages in one PR so they move together.
      # Groups are per-ecosystem, so the matching cargo group still arrives as
      # a separate PR. Keeping both halves updating is more important than
      # atomically combining them; the release workflow's "tauri-versions" gate
      # is what stops a half-updated pair from being tagged as a release.
      tauri:
        patterns:
          - '@tauri-apps/*'
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - 'tauri'
          - 'tauri-build'
          - 'tauri-plugin-*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
